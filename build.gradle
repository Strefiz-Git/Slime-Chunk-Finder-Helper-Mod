plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${mod_version}"
group = 'com.strefiz.slimechunkhud'

archivesBaseName = mod_id

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(${java_version})
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Gson for config persistence (bundled with Fabric API / Minecraft).
    implementation 'com.google.code.gson:gson:2.11.0'
}

processResources {
    inputs.property 'version', version
    inputs.property 'mcversion', minecraft_version
    filteringCharset 'UTF-8'
    from(project.sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand 'version': version, 'mcversion': minecraft_version
    }
}

loom {
    // Run the game with the mod on the client only.
    runs {
        client {
            workingDirectory project.file('run')
            property 'fabric-loader.mixin.mixins.slimechunkhud',
                'com.strefiz.slimechunkhud.mixin.Mixins'
            // NOTE: Mixins are optional in this design (flag read only if needed).
            // If no mixin is required, remove the property above.
        }
    }
}

tasks.named('jar') {
    from(sourceSets.main.resources) {
        exclude 'fabric.mod.json'
    }
    manifest {
        attributes 'Implementation-Title': mod_name,
                   'Implementation-Version': version
    }
}

tasks.named('sourceJar') {
    from sourceSets.main.allJava
}

tasks.named('javadocJar') {
    from sourceSets.main.allJava {
        exclude '**/mixin/**'
    }
}

tasks.named('check') {
    dependsOn(tasks.named('test'))
}
